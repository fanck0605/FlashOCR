[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "setuptools-scm>=8",
]
build-backend = "setuptools.build_meta"

[project]
name = "rapidocr"
dynamic = ["version"]
description = "Awesome OCR Library"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8,<4"
license = "Apache-2.0"
license-files = ["LICENSE", "MODEL_LICENSES.md"]
authors = [
    { name = "SWHL", email = "liekkaskono@163.com" },
]
keywords = [
    "ocr",
    "text_detection",
    "text_recognition",
    "db",
    "onnxruntime",
    "paddleocr",
    "openvino",
    "rapidocr",
]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "colorlog",
    "numpy>=1.19.5,<3.0.0",
    "omegaconf!=2.2.1", # https://github.com/omry/omegaconf/issues/934
    "opencv-python-headless>=4.5.1.48",
    "pillow",
    "pyclipper>=1.2.0",
    "pyyaml",
    "requests",
    "shapely>=1.7.1,!=2.0.4",
    "six>=1.15.0",
    "tqdm",
]

[project.urls]
Documentation = "https://rapidai.github.io/RapidOCRDocs"
Changelog = "https://github.com/RapidAI/RapidOCR/releases"

[project.scripts]
rapidocr = "rapidocr.main:main"

[project.optional-dependencies]
rtl = ["python-bidi>=0.4.2,<1.0"]
opencv-python = ["opencv-python>=4.5.1.48"]

[tool.setuptools]
include-package-data = true
platforms = ["Any"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rapidocr*"]
exclude = ["tests*"]
namespaces = false

[tool.setuptools.package-data]
rapidocr = [
    "**/*.yaml",
    "**/*.pyi",
    "py.typed",
]

[tool.setuptools_scm]
root = ".."
tag_regex = "^v?(?P<version>[0-9]+(?:\\.[0-9]+)*.*)$"
version_file = "rapidocr/_version.py"
local_scheme = "no-local-version"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
